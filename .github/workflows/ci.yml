name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Java ${{ matrix.java }} / ${{ matrix.db }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [8]
        db: [h2]
        include:
          - os: ubuntu-latest
            java: 8
            db: mysql
          - os: ubuntu-latest
            java: 8
            db: postgresql

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 改名残留门禁（活文档禁旧名）
        if: matrix.os == 'ubuntu-latest' && matrix.db == 'h2'
        shell: bash
        run: |
          set -euo pipefail
          # 只扫 Markdown（残留风险本质是文档命名一致性）；活文档禁旧名，记录类文档保留当时的名字。
          # 白名单：ADR / 实现记录 / 调研 / 规划 / handoff / CHANGELOG。
          hits=$(git grep -n 'CONTEXT\.md' -- '*.md' \
            ':!docs/adr/**' ':!docs/impl/**' ':!docs/research/**' \
            ':!docs/planning/**' ':!.handoff/**' ':!CHANGELOG.md' || true)
          if [ -n "$hits" ]; then
            echo '::error::活文档中出现旧名 CONTEXT.md（现名 GLOSSARY.md）：'
            printf '%s\n' "$hits"
            exit 1
          fi
          echo '改名残留门禁通过：活文档无旧名残留'

      - name: 设置 JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: 编译与测试
        shell: bash
        run: mvn clean verify --batch-mode --no-transfer-progress -Dflowable.test.db=${{ matrix.db }}

      - name: 上传测试报告
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-${{ matrix.db }}-java${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

  report-status:
    name: 上报 CI 聚合状态（分支保护所需的 status context）
    needs: build
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    if: always()
    steps:
      - name: 写入 CI status context
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ needs.build.result }}' === 'success' ? 'success' : 'failure';
            // pull_request 事件下 Actions 检出的是 merge ref，context.sha 为 merge commit；
            // 分支保护规则评估 head commit 的 status，故显式取 PR head SHA。
            const sha = context.payload.pull_request
              ? context.payload.pull_request.head.sha
              : context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sha,
              context: 'CI',
              state: outcome,
              description: `矩阵构建结果: ${outcome}`,
            });

